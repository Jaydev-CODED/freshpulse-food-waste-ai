name: FreshPulse AI — CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"   # nightly 2am UTC — MLOps retraining

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: freshpulse-ai

jobs:
  # ─────────────────────────────────────────────
  # 1. Code Quality — Ruff Lint + Format Check
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Run Ruff lint
        run: ruff check .
      - name: Run Ruff format check
        run: ruff format --check .

  # ─────────────────────────────────────────────
  # 2. Backend Tests — Pytest with coverage
  # ─────────────────────────────────────────────
  test:
    name: Pytest (Backend + ML + MLOps)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov
      - name: Run Pytest with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # 3. SonarCloud Code Quality Gate
  # ─────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install & run pytest for coverage
        run: |
          pip install -r requirements.txt pytest-cov
          pytest --cov=app --cov-report=xml -q
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # 4. Docker Build & Push (GHCR)
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 5. Deploy to Staging (main branch only)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy confirmation
        run: |
          echo "✅ FreshPulse AI image ready:"
          echo "  ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          echo "  Run: docker compose pull && docker compose up -d"

  # ─────────────────────────────────────────────
  # 6. MLOps — Automated Nightly Retrain (mlops branch or schedule)
  # ─────────────────────────────────────────────
  mlops-retrain:
    name: Automated XGBoost Retrain + Drift Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.ref, 'mlops'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run MLOps Retrain + Auto-Rollback
        run: |
          python -c "
          from app.core.database import init_db, SessionLocal
          from app.services.data_seeder import ensure_seeded_data
          from app.services.mlops import retrain_with_auto_rollback
          init_db()
          db = SessionLocal()
          ensure_seeded_data(db)
          result = retrain_with_auto_rollback(db)
          print(f'Action: {result.action}')
          print(f'Rolled back: {result.rolled_back}')
          print(f'New MAE: {result.new_mae}')
          print(f'Drift PSI: {result.drift_psi}')
          print(result.message)
          db.close()
          "
