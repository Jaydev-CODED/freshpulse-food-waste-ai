services:
  postgres:
    image: postgres:16-alpine
    container_name: freshpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshpulse}
      POSTGRES_DB: ${POSTGRES_DB:-freshpulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: freshpulse-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://freshpulse:freshpulse@postgres:5432/freshpulse
      WEATHER_LATITUDE: 19.0760
      WEATHER_LONGITUDE: 72.8777
      WEATHER_LOCATION_NAME: Mumbai Retail Hub
      HOLIDAY_COUNTRY_CODE: US
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: freshpulse-prometheus
    depends_on:
      - api
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: freshpulse-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
